# Paleta IntelliJ High Contrast — tema "High Contrast" da JetBrains (intellij-community):
#   platform/platform-resources/src/themes/HighContrast.theme.json   (interface)
#   platform/platform-resources/src/themes/highContrastScheme.xml    (editor)
# Interface: fundo #000000, seleção #3333FF, cabeçalho de tabela #000080,
# títulos #450073, foco #1AEBFF, texto desabilitado #E0861F, links #D2F53C.
# Editor: fundo #131314, texto #EBEBEB, linha atual #000066, seleção #006280.
# O esquema herda as cores de SQL do Darcula; usam-se as equivalentes
# genéricas (palavra-chave, string, número, função, constante, metadado).
theme.id=com.tiago.dbeaver.themepack.intellijhighcontrast.dark
theme.label=High Contrast
theme.file=intellij-high-contrast

